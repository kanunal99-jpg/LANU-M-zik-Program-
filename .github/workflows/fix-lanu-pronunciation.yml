name: Fix LANU pronunciation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(a11y): pronounce LANU as a word'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch accessibility pronunciation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lanu/music/MainActivity.kt')
          s = p.read_text()
          old = 'header.addView(TextView(this).apply{text="LANU";textSize=29f;setTextColor(Color.WHITE);typeface=Typeface.DEFAULT_BOLD},LinearLayout.LayoutParams(0,dp(52),1f))'
          new = 'header.addView(TextView(this).apply{text="LANU";contentDescription="Lanu";textSize=29f;setTextColor(Color.WHITE);typeface=Typeface.DEFAULT_BOLD},LinearLayout.LayoutParams(0,dp(52),1f))'
          if old not in s:
              raise SystemExit('expected LANU header text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lanu/music/MainActivity.kt
          git commit -m "fix(a11y): pronounce LANU as a word"
          git push
