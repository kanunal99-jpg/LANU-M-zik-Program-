name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Set APK filename
        id: apk
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          APK="lanu-music-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK"
          echo "path=app/build/outputs/apk/debug/$APK" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Publish tagged APK as GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "LANU Music $GITHUB_REF_NAME" \
            --generate-notes
