name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Repair playlist source syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lanu/music/MainActivity.kt')
          s = p.read_text()
          old = 'c.getLong(duration))}}}}.onFailure'
          new = 'c.getLong(duration))}}}.onFailure'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Repaired extra closing brace in loadDeviceMusic')
          else:
              print('No source repair needed')
          PY
      - name: Static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:name=".PlaybackService"' app/src/main/AndroidManifest.xml
          grep -q 'android:enabled="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="mediaPlayback"' app/src/main/AndroidManifest.xml
          grep -q 'androidx.media3:media3-exoplayer' app/build.gradle.kts
          grep -q 'androidx.media3:media3-session' app/build.gradle.kts
          grep -q 'OnlineCatalogClient' app/src/main/java/com/lanu/music/MainActivity.kt
          grep -q 'https://itunes.apple.com/search' app/src/main/java/com/lanu/music/OnlineCatalogClient.kt
          test -f app/src/main/java/com/lanu/music/OnlineCatalogClient.kt
          test -f app/src/main/java/com/lanu/music/PlaybackService.kt
          test -f app/src/main/java/com/lanu/music/MusicTrack.kt
          test -f app/src/main/java/com/lanu/music/PlaylistStore.kt
          echo 'Static smoke checks passed.'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: APK checksum
        id: checksum
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Set APK filename
        id: apk
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          APK="lanu-music-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK"
          echo "path=app/build/outputs/apk/debug/$APK" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.path }}
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Store APK and checksum in repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p releases
          cp "${{ steps.apk.outputs.path }}" "releases/${{ steps.apk.outputs.name }}"
          cp app/build/outputs/apk/debug/SHA256SUMS.txt "releases/${{ steps.apk.outputs.name }}.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/${{ steps.apk.outputs.name }} releases/${{ steps.apk.outputs.name }}.sha256 app/src/main/java/com/lanu/music/MainActivity.kt
          if git diff --cached --quiet; then
            echo "APK, checksum and source are already current"
          else
            git commit -m "build: add ${{ steps.apk.outputs.name }} and SHA256 [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish tagged APK as GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" "app/build/outputs/apk/debug/SHA256SUMS.txt" \
            --title "LANU Music $GITHUB_REF_NAME" \
            --generate-notes
