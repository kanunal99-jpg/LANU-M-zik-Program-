name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/lanu-music-preview-v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-music-preview-v0.2.0
          path: app/build/outputs/apk/debug/lanu-music-preview-v0.2.0.apk
